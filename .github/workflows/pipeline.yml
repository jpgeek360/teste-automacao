name: Pipeline CI/CD - teste-automacao

on:
  push:
    branches: [ "main" ]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Analise Estatica (Ruff)
        run: |
          ruff check . --ignore EXE002

      - name: 2. Analise de Seguranca (Bandit)
        run: |
          bandit -r . -x ./venv -s B101,B104

      - name: 3. Executar Testes Unitarios (Pytest)
        run: |
          pytest test_app.py

       - name: Run Ruff
        run: ruff check . --ignore EXE002,DTZ005

  build-imagem-docker:
    needs: qualidade-e-testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Testar Build da Imagem Docker
        run: |
          docker build -t teste-automacao:latest .
